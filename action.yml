---
name: "aibomgen-cli Action"
description: "Generates an AI Bill of Materials (AIBOM) for ML model files using aibomgen-cli"
author: "IDLab Discover"
branding:
  color: blue
  icon: cpu

inputs:
  command:
    required: true
    description: "The aibomgen-cli command to execute: download, scan, generate, validate, completeness, vuln-scan, merge"
    default: "scan"

  scan-input:
    required: false
    description: "Directory path for command=scan"
    default: "."

  generate-model-ids:
    required: false
    description: "Comma or newline-separated Hugging Face model IDs for command=generate"

  validate-input:
    required: false
    description: "Path or comma/newline-separated paths to existing AIBOM files for command=validate"

  validate-strict:
    required: false
    description: "Enable strict validation mode for command=validate"
    default: "false"

  validate-fail-severity:
    required: false
    description: "Lowest vulnerability severity that fails strict validation: critical, high, medium, low, info"
    default: "medium"

  validate-min-score:
    required: false
    description: "Minimum completeness score (0..1) for command=validate"

  completeness-input:
    required: false
    description: "Path to an existing AIBOM file for command=completeness"

  vuln-scan-input:
    required: false
    description: "Path or comma/newline-separated paths to existing AIBOM files for command=vuln-scan"

  vuln-scan-enrich:
    required: false
    description: "Inject vulnerability findings back into the AIBOM for command=vuln-scan"
    default: "false"

  merge-aibom-files:
    required: false
    description: "Comma or newline-separated AIBOM file paths for command=merge"

  merge-sbom-file:
    required: false
    description: "SBOM file path for command=merge"

  merge-output-file:
    required: false
    description: "Output merged BOM file path for command=merge"

  merge-deduplicate:
    required: false
    description: "Deduplicate components by bom-ref for command=merge"
    default: "true"

  format:
    required: false
    description: "Output format for command=scan and command=generate: json or xml"
    default: "json"

  spec-version:
    required: false
    description: "CycloneDX spec version (for commands supporting --spec)"

  hf-token:
    required: false
    description: "Hugging Face access token for private/gated models"

  hf-mode:
    required: false
    description: "Hugging Face metadata mode for scan/generate: online or dummy"
    default: "online"

  hf-timeout:
    required: false
    description: "Hugging Face timeout in seconds per request (0 uses the CLI default)"
    default: "0"

  no-security-scan:
    required: false
    description: "Disable HF security scan enrichment on scan/generate"
    default: "false"

  config:
    required: false
    description: "Path to an aibomgen-cli configuration file (--config)"

  log-level:
    required: false
    description: "Log verbosity: quiet, standard, debug"
    default: "standard"

  aibomgen-version:
    required: false
    description: "aibomgen-cli release to use (for example v0.3.0)"
    default: "v0.3.0"

  aibomgen-sha256:
    required: false
    description: "Optional SHA256 checksum for downloaded release archive"

  github-token:
    description: "GitHub token used for uploading artifacts and release assets"
    required: false
    default: ${{ github.token }}

  artifact-name:
    description: "Optional label for the uploaded workflow artifact bundle; produced BOM files keep their original filenames inside the artifact"
    required: false

  upload-artifact:
    required: false
    description: "Upload produced output files as a workflow artifact bundle while preserving each file's original filename"
    default: "true"

  upload-artifact-retention:
    required: false
    description: >
      Retention policy in days for the uploaded workflow artifact.
      Minimum 1 day, maximum 90 days (repository default if 0).
    default: "0"

  upload-release-assets:
    required: false
    description: "Attach produced output files to the release on release events and tag pushes, using their original filenames"
    default: "true"

outputs:
  cmd:
    description: "A reference to the aibomgen-cli command (set when command=download)"

  executed-command:
    description: "The command that was executed"

  written-files:
    description: "Newline-separated output file paths discovered by the action"

runs:
  using: "node24"
  main: "dist/index.cjs"
