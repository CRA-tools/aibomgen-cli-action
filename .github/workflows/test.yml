name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm test
      - run: npm run package

      - name: Ensure dist is up to date
        run: |
          git diff --exit-code dist/ || \
          (echo "ERROR: dist/ is out of date. Run 'npm run package' and commit the result." && exit 1)

  smoke-action:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve CLI with local action
        id: download
        uses: ./
        with:
          command: download

      - name: Verify the resolved CLI runs
        env:
          CMD: ${{ steps.download.outputs.cmd }}
        run: '"$CMD" version'
